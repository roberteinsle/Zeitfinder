# Lokale Entwicklung und Codespaces (nicht für Produktion).
#   docker compose up -d db        → nur PostgreSQL (für php artisan serve im Devcontainer)
#   docker compose up -d --build   → App im Produktions-Image mit Bind-Mount des Codes
services:
    app:
        build: .
        ports:
            - "8080:8080"
        environment:
            - APP_ENV=local
            - APP_DEBUG=true
            - AUTORUN_ENABLED=true
            - AUTORUN_LARAVEL_CONFIG_CACHE=false
            - AUTORUN_LARAVEL_ROUTE_CACHE=false
            - AUTORUN_LARAVEL_VIEW_CACHE=false
            - AUTORUN_LARAVEL_EVENT_CACHE=false
            - AUTORUN_LARAVEL_OPTIMIZE=false
            - PHP_OPCACHE_ENABLE=0
            - DB_CONNECTION=pgsql
            - DB_HOST=db
            - DB_PORT=5432
            - DB_DATABASE=app
            - DB_USERNAME=app
            - DB_PASSWORD=app
        volumes:
            - .:/var/www/html
        depends_on:
            db:
                condition: service_healthy

    db:
        image: postgres:18-alpine
        ports:
            - "5432:5432"
        environment:
            - POSTGRES_DB=app
            - POSTGRES_USER=app
            - POSTGRES_PASSWORD=app
        volumes:
            # Ab PostgreSQL 18 liegt PGDATA unter /var/lib/postgresql/<version>/docker
            - db-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U app"]
            interval: 5s
            retries: 10

volumes:
    db-data:
